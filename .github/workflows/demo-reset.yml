name: 데모 데이터 초기화

# 공개 데모(demo.keystonehr.app)는 방문자가 관리자 권한으로 자유롭게 조작할 수 있다.
# 매일 새벽에 스냅샷(hr/scripts/demo-reset.sql)으로 원상 복구한다.
# 스냅샷을 갱신하려면: cd hr && node scripts/generate-demo-snapshot.mjs
on:
  schedule:
    # 6시간마다 (KST 03·09·15·21시). 방문자가 각자 직원을 등록하면
    # 인원 한도(데모 75명)에 닿아 이후 방문자가 등록을 체험할 수 없게 된다.
    # 스냅샷이 577행이라 1회 복구 비용이 D1 일일 한도의 0.6%뿐이므로,
    # 한도 도달을 방문자 행동으로 처리(자동 리셋)하는 대신 주기를 짧게 가져간다.
    - cron: '0 */6 * * *'
  workflow_dispatch: # 수동 실행 (데모가 훼손됐을 때 즉시 복구용)

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 의존성 설치
        working-directory: hr
        run: npm ci

      - name: 데모 테넌트 초기화
        working-directory: hr
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute hr-saas-db --remote --yes --file=scripts/demo-reset.sql

      - name: 복구 확인
        working-directory: hr
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute hr-saas-db --remote --json \
            --command "SELECT COUNT(*) AS employees FROM employees e JOIN tenants t ON e.tenantId=t.id WHERE t.subdomain='demo'"
