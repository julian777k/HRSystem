name: Deploy to Cloudflare Workers

# main 푸시 시 자동 배포 + 수동 실행(workflow_dispatch) 지원.
# Windows에서 코드를 작성/커밋하더라도 빌드·배포는 항상 Linux(ubuntu)에서 실행되어
# OpenNext의 Windows 런타임 비호환 문제를 원천 차단한다.
on:
  push:
    branches: [main]
    paths:
      - 'hr/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 동시 배포 방지 — 이전 배포가 끝나기 전 새 배포가 겹치지 않게 한다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 1단계: 무결성 게이트 — 타입 체크 + 테스트가 통과해야만 배포로 넘어간다.
  test:
    name: 테스트 게이트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hr/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: Prisma 클라이언트 생성
        run: npx prisma generate
      - name: 타입 체크
        run: npx tsc --noEmit
      - name: 유닛 테스트
        run: npm test

  # 2단계: 빌드 + 마이그레이션 + 배포 — test 통과가 전제(needs: test).
  deploy:
    name: 빌드 및 배포
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hr/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: OpenNext 빌드 (Linux)
        run: npm run cf:build
      # D1 마이그레이션을 배포보다 먼저 적용 — 새 코드가 참조하는 컬럼이
      # 없는 상태로 배포되어 런타임이 깨지는 것을 방지한다.
      - name: D1 마이그레이션 적용
        run: npx wrangler d1 migrations apply hr-saas-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Cloudflare Workers 배포
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # 3단계: 배포 후 스모크 테스트 — 실제 서비스가 응답하는지 확인.
  # 실패하면 워크플로우가 빨간불로 표시되어 즉시 인지할 수 있다.
  smoke:
    name: 배포 후 스모크 테스트
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: 서비스 응답 확인
        run: |
          echo "랜딩/서브도메인 응답 확인..."
          apex=$(curl -s -o /dev/null -w "%{http_code}" https://keystonehr.app/)
          demo=$(curl -s -o /dev/null -w "%{http_code}" https://demo.keystonehr.app/login)
          echo "apex=$apex  demo/login=$demo"
          # 5xx면 실패 처리
          if [ "$apex" -ge 500 ] || [ "$demo" -ge 500 ]; then
            echo "::error::배포 후 5xx 응답 감지 — 배포 확인 필요"
            exit 1
          fi
          echo "스모크 테스트 통과"
